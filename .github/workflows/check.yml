      - name: Discordテスト
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"🚗 片道GO通知Botのテストです！"}' \
            "$DISCORD_WEBHOOK_URL"

name: 片道GO監視

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 片道GOを確認
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FILTER_DEPARTURE: ${{ vars.FILTER_DEPARTURE }}
          FILTER_ARRIVAL: ${{ vars.FILTER_ARRIVAL }}
          FILTER_KEYWORD: ${{ vars.FILTER_KEYWORD }}
        run: python main.py

      - name: state.jsonを保存
        run: |
          git config user.name "katamichi-go-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update notification state"
          git push
